name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extensions/chatgpt-history-manager/package-lock.json

      - name: Install dependencies
        working-directory: extensions/chatgpt-history-manager
        run: npm ci

      - name: Build extension site
        working-directory: extensions/chatgpt-history-manager
        run: npm run build

      - name: Assemble pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/extensions/chatgpt-history-manager
          cp index.html _site/index.html
          cp landing.css _site/landing.css
          cp google446cdd6e451ec880.html _site/google446cdd6e451ec880.html
          cp -r extensions/chatgpt-history-manager/dist/* _site/extensions/chatgpt-history-manager/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
